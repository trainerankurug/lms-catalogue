spring:
  application:
    name: lms-catalog
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: jdbc:h2:mem:lms_catalog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

lms:
  auth:
    username: ${LMS_AUTH_USERNAME}
    password: ${LMS_AUTH_PASSWORD}
    jwt-secret: ${LMS_JWT_SECRET}

server:
  port: 8080

logging:
  level:
    CATALOG_AUDIT: INFO
